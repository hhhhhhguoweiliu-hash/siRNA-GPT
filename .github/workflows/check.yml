name: Program checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scientific integration and cloud boundary checks
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Check frontend syntax and browser backup states
        run: node test_browser_backup.cjs
