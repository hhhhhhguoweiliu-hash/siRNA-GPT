   <g id="text_1">
    <text style="font-size: 6.003937px; font-family: 'Arial'" transform="translate(89.537129 53.48651)">Researcher input</text>
    <text style="font-size: 6.003937px; font-family: 'Arial'" transform="translate(73.350421 59.836799)">Task + guide direction + state</text>
